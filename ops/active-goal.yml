  - 必须撤销、删除或改写任何 source audit、review record 或 ledger 历史才能继续。
  - 必须新增 VERIFIED、HUMAN_APPROVED 或任何 human 证据才能继续。
  - content inventory、trust projection、release metadata、Markdown fence/link、strict build 或单元测试出现无法在允许路径内修复的失败。
  - GitHub 凭证不可用，或必须落盘 token、密钥、本机路径才能继续。
  - origin/main 在收口前移动导致基线不可复现，且无法在不 rebase 的前提下继续。
  - 预算耗尽或 review_after 到达 2026-08-29。
