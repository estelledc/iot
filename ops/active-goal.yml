objective: >-
  作为 IOT-T065 完成后的新有限目标，承接 2026-08-27 用户"持续推进"授权中
  指定的下一切片：批量占位 trust 记录的处置诚实化。经对 schema 的实测，
  revocation 块把签发者硬性绑定为 by_actor_type=HUMAN（const）、
  by_role=GOVERNANCE_REVIEWER（const）与 human-* id，authority registry
  也没有任何 governance 身份；agent 代签撤销即重演 T065 findings 判定的
  同类伪造。因此本目标不改写 data/ 任何字节，交付一份可执行的处置计划：
  给出撤销、agent 降级 supersede 与分批混合三条机械路径的 validator 联动
  分析、每批验收命令、baseline 连锁数字表和职责分离设计（agent 只准备
  diff，人类以真实身份 review 并 merge 作为签发行为）。不新增任何
  VERIFIED/HUMAN_APPROVED/PARTIAL，不扩容 Layer 3-8，不改 VERSION，
  交付物通过新分支 PR 供人工 review，不合并。
